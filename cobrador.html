<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Rota - Cobrador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Reutilizamos o mesmo CSS para pegar o fundo e estilos -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">

    <!-- Camada de Animação de Partículas -->
    <div id="particles-js"></div>

    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-box">
                <div class="text-center mb-4">
                    <i class="bi bi-bicycle fs-1 text-primary"></i>
                    <h2 class="mt-2">Acesso Rota</h2>
                    <p class="text-muted small">Área restrita para cobradores</p>
                </div>

                <form id="cobrador-login-form">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="cob-user" placeholder="Usuário" required>
                        <label for="cob-user">Usuário da Rota</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input type="password" class="form-control" id="cob-pass" placeholder="Senha" required>
                        <label for="cob-pass">Senha</label>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg" id="cob-login-btn">
                            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"
                                style="display: none;"></span>
                            Acessar Rota
                        </button>

                        <!-- Botão para Voltar ao Login Principal -->
                        <a href="/login.html" class="btn btn-link text-decoration-none text-muted">
                            <i class="bi bi-arrow-left"></i> Voltar
                        </a>
                    </div>

                    <div id="cob-error" class="text-danger text-center mt-3" style="display: none;">
                        Dados inválidos.
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/libs/particles.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- 1. CONFIGURAÇÃO DAS PARTÍCULAS (Cópia exata do login principal) ---
            particlesJS('particles-js', {
                "particles": {
                    "number": { "value": 160, "density": { "enable": true, "value_area": 800 } },
                    "color": { "value": "#ffffff" },
                    "shape": { "type": "circle" },
                    "opacity": { "value": 0.5, "random": true },
                    "size": { "value": 3, "random": true },
                    "line_linked": { "enable": false },
                    "move": { "enable": true, "speed": 1, "direction": "bottom", "random": false, "straight": false, "out_mode": "out", "bounce": false }
                },
                "interactivity": {
                    "detect_on": "canvas",
                    "events": { "onhover": { "enable": false }, "onclick": { "enable": false }, "resize": true }
                },
                "retina_detect": true
            });

            // --- 2. LÓGICA DE LOGIN DO COBRADOR ---
            const loginForm = document.getElementById('cobrador-login-form');
            const loginBtn = document.getElementById('cob-login-btn');
            const errorMsg = document.getElementById('cob-error');
            const spinner = loginBtn.querySelector('.spinner-border');

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const username = document.getElementById('cob-user').value;
                const password = document.getElementById('cob-pass').value;

                // UI Loading
                loginBtn.disabled = true;
                spinner.style.display = 'inline-block';
                errorMsg.style.display = 'none';

                try {
                    const response = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });

                    if (response.ok) {
                        const data = await response.json();

                        // Verifica se é realmente um cobrador
                        if (data.role === 'cobrador') {
                            sessionStorage.setItem('authToken', data.token);
                            sessionStorage.setItem('isAuthenticated', 'true');
                            sessionStorage.setItem('userRole', 'cobrador');

                            window.location.href = '/index.html';
                        } else {
                            errorMsg.textContent = "Este login não tem permissão de rota.";
                            errorMsg.style.display = 'block';
                        }
                    } else {
                        errorMsg.textContent = "Usuário ou senha incorretos.";
                        errorMsg.style.display = 'block';
                    }
                } catch (err) {
                    errorMsg.textContent = "Erro de conexão.";
                    errorMsg.style.display = 'block';
                } finally {
                    loginBtn.disabled = false;
                    spinner.style.display = 'none';
                }
            });
        });
    </script>
</body>

</html>
