<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Cobrador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #212529;
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            background: white;
            color: #333;
            padding: 30px;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <h3 class="text-center mb-4">Acesso do Cobrador</h3>
        <form id="cobrador-login-form">
            <div class="mb-3">
                <label class="form-label">Usuário</label>
                <input type="text" class="form-control" id="cob-user" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Senha</label>
                <input type="password" class="form-control" id="cob-pass" required>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-dark">Entrar</button>
            </div>
            <p id="cob-error" class="text-danger text-center mt-3 d-none">Dados inválidos.</p>
        </form>
    </div>

    <script>
        document.getElementById('cobrador-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('cob-user').value;
            const password = document.getElementById('cob-pass').value;
            const errorMsg = document.getElementById('cob-error');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data.role === 'cobrador') {
                        sessionStorage.setItem('authToken', data.token);
                        sessionStorage.setItem('isAuthenticated', 'true');
                        sessionStorage.setItem('userRole', 'cobrador'); // <--- AQUI ESTÁ O SEGREDO
                        window.location.href = '/index.html';
                    } else {
                        errorMsg.textContent = "Use o acesso de administrador.";
                        errorMsg.classList.remove('d-none');
                    }
                } else {
                    errorMsg.classList.remove('d-none');
                }
            } catch (err) {
                alert('Erro de conexão');
            }
        });
    </script>
</body>

</html>
